<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f6f8fa" rx="6" ry="6"/>
  
  <!-- GitHub PR Header Box -->
  <rect x="50" y="20" width="700" height="70" rx="6" ry="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  
  <!-- PR Title -->
  <text x="70" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292e">
    Documentation update: Fix typo in README
  </text>
  
  <!-- PR Number -->
  <text x="70" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#586069">
    #154
  </text>
  
  <!-- PR Description Box -->
  <rect x="50" y="100" width="700" height="350" rx="6" ry="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  
  <!-- PR Description Content -->
  <text x="70" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#24292e">
    <tspan x="70" y="135" font-weight="600">close #42</tspan>
    <tspan x="70" y="170">This PR references the work completed in <tspan fill="#0366d6">#123</tspan> (original PR).</tspan>
    <tspan x="70" y="205">This follow-up PR is created to properly link Issue <tspan fill="#0366d6">#42</tspan> for Lightning Bounty payment.</tspan>
    <tspan x="70" y="240">The main work was already completed and merged in the original PR, but it was missing</tspan>
    <tspan x="70" y="270">the proper closing syntax to trigger the bounty payment.</tspan>
  </text>
  
  <!-- Issue Link Box -->
  <rect x="70" y="310" width="660" height="50" rx="6" ry="6" fill="#f1f8ff" stroke="#c8e1ff" stroke-width="1"/>
  <text x="90" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292e">
    <tspan>This pull request will close Issue <tspan fill="#0366d6">#42</tspan> when merged.</tspan>
  </text>
  
  <!-- Original PR Link Box -->
  <rect x="70" y="380" width="660" height="50" rx="6" ry="6" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1"/>
  <text x="90" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292e">
    <tspan>References original pull request <tspan fill="#0366d6">#123</tspan></tspan>
  </text>
  
  <!-- Highlighted Elements -->
  <rect x="70" y="135" width="90" height="20" rx="3" ry="3" fill="#fffbdd" fill-opacity="0.7" stroke="none"/>
  <rect x="240" y="170" width="40" height="20" rx="3" ry="3" fill="#def" fill-opacity="0.7" stroke="none"/>
  <rect x="350" y="205" width="40" height="20" rx="3" ry="3" fill="#def" fill-opacity="0.7" stroke="none"/>
</svg>
